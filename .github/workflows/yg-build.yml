name: yg-build
on:
  push:
    branches: [yupgoolg]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.1' }
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null
      - name: Private files
        env: { YG_PASS: '${{ secrets.YG_PASS }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/gen"
          openssl enc -d -aes-256-cbc -pbkdf2 -in yg/private.tgz.enc -pass env:YG_PASS | tar -xz -C "$RUNNER_TEMP/gen"
          ls "$RUNNER_TEMP/gen"
      - name: Build tag
        run: |
          echo "TAG=yg-$(TZ=Asia/Seoul date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources><string name="ygBuild" translatable="false">%s</string></resources>\n' "$(TZ=Asia/Seoul date +%m%d-%H%M)" > dm/android/app/src/main/res/values/yg_build.xml
      - name: Build
        env:
          DM_ANDROID_KEYSTORE: '${{ runner.temp }}/gen/release.p12'
          DM_ANDROID_KEY_PASS: '${{ secrets.YG_PASS }}'
          DM_ANDROID_KEY_ALIAS: yg
        run: gradle --no-daemon -p dm/android :app:assembleRelease -PdmGenDir="$RUNNER_TEMP/gen" -PdmPython=/usr/bin/python3 -PdmAppId=com.xiaoboluo.d2r.yg
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          apk=$(ls dm/android/app/build/outputs/apk/release/*.apk | head -1)
          tag="$TAG"
          cp "$apk" "D2R-yupgoolg.apk"
          gh release create "$tag" D2R-yupgoolg.apk --target "$GITHUB_SHA" --title "엽굵 모드판 $tag" --notes "${{ github.event.head_commit.message }}"
